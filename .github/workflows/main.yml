name: Build EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: |
          python -m pip install llama-cpp-python --only-binary=llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m pip install -r requirements.txt
          python -c "import llama_cpp; print('Moteur IA OK', llama_cpp.__version__)"
      - name: Compiler l'EXE (moteur IA intégré)
        run: python -m PyInstaller --noconfirm --onefile --windowed --collect-all llama_cpp --name AI_Assistant_Hybride main.py
      - name: Ajouter le modèle IA à côté de l'EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/models | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf" -OutFile "dist/models/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf"
      - uses: actions/upload-artifact@v4
        with:
          name: AI_Assistant_Hybride_complet
          path: dist/
